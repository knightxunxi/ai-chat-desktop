name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows ${{ matrix.build_type }} (MSVC)
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        build_type:
          - Debug
          - Release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt (MSVC)
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.0"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Configure
        run: >
          cmake
          -S .
          -B build-ci
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        run: cmake --build build-ci --config ${{ matrix.build_type }} --parallel 4

      - name: Test
        run: ctest --test-dir build-ci -C ${{ matrix.build_type }} --output-on-failure

      - name: Package (Release only)
        if: matrix.build_type == 'Release'
        shell: pwsh
        run: |
          mkdir release-artifacts -Force
          windeployqt build-ci/Release/AIChatDesktop.exe --dir release-artifacts
          Copy-Item build-ci/Release/AIChatDesktop.exe release-artifacts/
          Compress-Archive -Path release-artifacts/* -DestinationPath AIChatDesktop-windows-x64-${{ github.sha }}.zip -Force

      - name: Upload Artifact (Release only)
        if: matrix.build_type == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: AIChatDesktop-windows-x64
          path: AIChatDesktop-windows-x64-*.zip
