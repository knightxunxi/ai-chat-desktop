name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows ${{ matrix.build_type }} (MinGW)
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        build_type:
          - Debug

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt (MinGW)
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.0"
          host: windows
          target: desktop
          arch: win64_mingw
          cache: true

      - name: Configure
        shell: bash
        run: >
          cmake
          -S .
          -B build-ci
          -G "MinGW Makefiles"
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        shell: bash
        run: cmake --build build-ci -j4

      - name: Test
        shell: bash
        run: ctest --test-dir build-ci -C ${{ matrix.build_type }} --output-on-failure
